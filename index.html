<style>
:root{--esp:#2B1A14;--esp2:#3A241B;--cream:#F7F0E6;--card:#FFFBF5;--gold:#C9A061;--gold2:#E2C48C;--glow:#8CF5BF;--ink:#2A1A14;--mut:#7C6A5E;--line:#EADFD0;--red:#B5574B;--mint:#2E9E6A;--warn:#B8862C}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Manrope',system-ui,sans-serif;background:var(--cream);color:var(--ink);max-width:480px;margin:0 auto;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
h1,h2,.serif{font-family:'Playfair Display',Georgia,serif}
button,input,select,textarea{font:inherit;color:inherit}
.top{background:radial-gradient(120% 140% at 85% -20%,rgba(201,160,97,.45),transparent 55%),linear-gradient(160deg,#3A241B,#20130E);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 18px 18px;border-radius:0 0 24px 24px;box-shadow:0 10px 30px rgba(43,26,20,.3);display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.top small{color:var(--gold2);font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.top h1{font-size:24px;margin-top:2px}
.icon-btn{background:rgba(255,255,255,.1);border:1px solid rgba(201,160,97,.45);color:var(--gold2);border-radius:12px;width:40px;height:40px;font-size:18px;cursor:pointer;flex:none}
.wrap{padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 6px 18px rgba(43,26,20,.06)}
.hero{background:radial-gradient(90% 120% at 100% 0%,rgba(201,160,97,.35),transparent 60%),linear-gradient(150deg,#3A241B,#1E120D);border:1px solid rgba(201,160,97,.35);color:#fff;border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:0 14px 34px rgba(43,26,20,.3)}
.hero .lbl{color:var(--gold2);font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.hero .val{font-size:34px;font-weight:800;color:var(--glow);text-shadow:0 0 18px rgba(140,245,191,.55);margin:4px 0}
.hero .sub{font-size:13px;opacity:.85}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini .lbl{font-size:10px;color:var(--mut);text-transform:uppercase;font-weight:800;letter-spacing:.06em}
.mini .val{font-size:19px;font-weight:800;margin-top:4px}
.neg{color:var(--red)}.pos{color:var(--mint)}
.sec{font-size:12px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;margin:18px 2px 8px;display:flex;justify-content:space-between;align-items:center}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:15px}
.row:last-child{border-bottom:0}
.tag{font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap}
.t-ok{background:#E3F2E6;color:var(--mint)}.t-due{background:#F8EBD3;color:var(--warn)}.t-new{background:#F6E2DC;color:var(--red)}.t-gold{background:#F3E6CF;color:#8A6428}
.alert{display:flex;gap:10px;align-items:flex-start;font-size:14px;padding:10px 0;border-bottom:1px solid var(--line)}
.alert:last-child{border:0}
.dot{width:10px;height:10px;border-radius:50%;margin-top:5px;flex:none}
label{display:block;font-size:12px;font-weight:800;color:var(--mut);margin:12px 0 5px;letter-spacing:.02em}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;font-size:16px;background:#fff}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);border-color:var(--gold)}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:14px;background:linear-gradient(145deg,#E2C48C,#B88A47);color:var(--esp);font-weight:800;font-size:16px;margin-top:14px;cursor:pointer;box-shadow:0 8px 20px rgba(184,138,71,.35)}
.btn.dark{background:linear-gradient(145deg,#3A241B,#20130E);color:var(--gold2);box-shadow:none}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);box-shadow:none}
.btn.danger{background:transparent;border:1px solid #E7C3BC;color:var(--red);box-shadow:none}
.result{background:linear-gradient(150deg,#3A241B,#1E120D);color:#F7F0E6;border-radius:16px;padding:14px;margin-top:14px}
.result .row{border-color:rgba(255,255,255,.12)}
.result .big{font-size:32px;font-weight:800;color:var(--glow);text-shadow:0 0 16px rgba(140,245,191,.5)}
.result .hint{font-size:12px;color:var(--gold2)}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 4px calc(10px + env(safe-area-inset-bottom));z-index:5}
nav button{background:none;border:0;font-size:11px;font-weight:800;color:var(--mut);flex:1;cursor:pointer;padding:2px}
nav button b{display:block;font-size:20px;line-height:1.3}
nav button.on{color:var(--warn)}
.fab{position:fixed;right:max(16px,calc(50% - 224px));bottom:calc(86px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;border:0;background:linear-gradient(145deg,#E2C48C,#B88A47);color:var(--esp);font-size:30px;font-weight:800;box-shadow:0 10px 26px rgba(184,138,71,.5);z-index:6;cursor:pointer}
.screen{display:none}.screen.on{display:block}
.empty{text-align:center;color:var(--mut);padding:26px 10px;font-size:14px}
.empty b{display:block;font-size:30px;margin-bottom:6px}
.seg{display:flex;background:#EFE5D8;border-radius:12px;padding:3px;gap:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:transparent;padding:9px;border-radius:10px;font-weight:800;font-size:13px;color:var(--mut);cursor:pointer}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 6px rgba(43,26,20,.1)}
.order .who{font-weight:800}
.order .what{font-size:14px;margin:6px 0;color:var(--ink)}
.order .money{display:flex;gap:16px;font-size:13px;color:var(--mut)}
.order .money b{color:var(--ink)}
.monthbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.monthbar button{background:var(--card);border:1px solid var(--line);border-radius:10px;width:38px;height:38px;font-size:18px;cursor:pointer}
.monthbar strong{font-family:'Playfair Display',serif;font-size:20px}
dialog{border:0;border-radius:22px 22px 0 0;padding:0;width:100%;max-width:480px;margin:auto auto 0;max-height:92vh;background:var(--cream);color:var(--ink)}
dialog::backdrop{background:rgba(20,10,6,.55)}
.sheet{padding:18px 16px calc(22px + env(safe-area-inset-bottom));overflow:auto;max-height:92vh}
.sheet h2{font-size:22px;margin-bottom:4px}
.check{display:flex;align-items:center;gap:10px;margin-top:14px;font-weight:700}
.check input{width:22px;height:22px}
.split2{display:flex;gap:10px}.split2>*{flex:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom));background:var(--esp);color:var(--gold2);padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.welcome{background:radial-gradient(100% 70% at 50% 0%,rgba(201,160,97,.4),transparent 60%),linear-gradient(170deg,#3A241B,#170D09);color:#fff;border-radius:22px;padding:22px 18px;text-align:center;margin-bottom:12px}
.welcome .logo{width:64px;height:64px;border-radius:20px;margin:0 auto 12px;background:linear-gradient(145deg,#E2C48C,#B88A47);color:var(--esp);font-family:'Playfair Display',serif;font-size:34px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 34px rgba(201,160,97,.55)}
.welcome h2{font-size:24px}.welcome p{opacity:.85;font-size:14px;margin-top:6px}
.steps{text-align:left;margin-top:14px;font-size:14px;display:grid;gap:8px}
.steps div{display:flex;gap:10px;align-items:flex-start}.steps i{font-style:normal;flex:none;width:24px;height:24px;border-radius:50%;background:rgba(226,196,140,.25);color:var(--gold2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
.link{background:none;border:0;color:var(--warn);font-weight:800;cursor:pointer;font-size:13px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

/* ---------- Estado ---------- */
const KEY="glazura_v1";
const blank=()=>({v:1,products:[],orders:[],fixed:[],settings:{lang:null,name:"",rate:25,welcomed:false}});
let S=load();
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&x.v===1)return x}catch(e){}return blank()}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast("!")}}
const qs=new URLSearchParams(location.search);
if(!S.settings.lang){const q=qs.get("lang");S.settings.lang=(q==="es"||q==="ro")?q:((navigator.language||"").toLowerCase().startsWith("es")?"es":"ro")}
let t=T[S.settings.lang];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const num=v=>{const n=parseFloat(String(v).replace(",","."));return isFinite(n)?n:0};
const r2=n=>Math.round(n*100)/100;
const fmt=n=>{const v=r2(n);return v.toLocaleString("ro-RO",{maximumFractionDigits:Number.isInteger(v)?0:2})+" lei"};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const iso=d=>d.toISOString().slice(0,10);
const todayISO=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return iso(d)};
const dShort=s=>{if(!s)return"";const [y,m,d]=s.split("-");return `${+d} ${t.months[+m-1].slice(0,3).toLowerCase()}`};
const unitCost=p=>num(p.ing)+num(p.pack)+num(p.hours)*num(p.rate)+num(p.gas);
const unitPrice=p=>{const c=unitCost(p),m=Math.min(num(p.marg),95);return Math.ceil(c/(1-m/100)/5)*5};
const orderCost=o=>{if(o.productId){const p=S.products.find(x=>x.id===o.productId);if(p)return unitCost(p)*num(o.qty||1)}return num(o.cost)};
const restOf=o=>Math.max(0,num(o.price)-num(o.paid));

/* ---------- Navegación ---------- */
let tab="home", ordFilter="active", finMonth=todayISO().slice(0,7), wipeArmed=false;
function go(x){tab=x;render()}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>go(b.dataset.go));
document.getElementById("fab").onclick=()=>openOrder();
document.getElementById("btnSettings").onclick=openSettings;
function toast(m){const e=document.getElementById("toast");e.textContent=m;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),1600)}

/* ---------- Cálculo del mes ---------- */
function monthStats(ym){
  const os=S.orders.filter(o=>(o.date||"").slice(0,7)===ym);
  const billed=os.reduce((a,o)=>a+num(o.price),0), cashed=os.reduce((a,o)=>a+Math.min(num(o.paid),num(o.price)),0);
  const cost=os.reduce((a,o)=>a+orderCost(o),0), fixed=S.fixed.reduce((a,f)=>a+num(f.amount),0);
  const net=billed-cost-fixed;

function attentionItems(){
  const out=[], td=todayISO(), lim=new Date(); lim.setDate(lim.getDate()+3); const limISO=iso(lim);

    const when=o.date===td?t.today:(o.date<td?dShort(o.date):dShort(o.date));
    out.push({c:"var(--red)",h:t.dueSoon(esc(o.client),when,esc(o.desc||""))+(restOf(o)?` ${t.owes} <b>${fmt(restOf(o))}</b>.`:"")});
  });
  S.orders.filter(o=>!o.delivered&&num(o.paid)===0&&num(o.price)>0&&!(o.date&&o.date<=limISO)).forEach(o=>out.push({c:"var(--warn)",h:t.noDeposit(esc(o.client),dShort(o.date))}));
  S.orders.filter(o=>o.delivered&&restOf(o)>0).forEach(o=>out.push({c:"var(--warn)",h:t.restDue(esc(o.client),fmt(restOf(o)))}));

/* ---------- Ejemplo (coincide con la landing: 3.380 lei netos, 6.840 facturados, 920 por cobrar) ---------- */
function loadDemo(){
  const lang=S.settings.lang, name=S.settings.name; S=blank(); S.settings.lang=lang; S.settings.name=name; S.settings.welcomed=true;
  const L=T[lang];
  S.products=L.demoProducts.map(([n,i,p,h,r,g,m])=>({id:uid(),name:n,ing:i,pack:p,hours:h,rate:r,gas:g,marg:m}));
  S.fixed=L.demoFixed.map(([n,a])=>({id:uid(),name:n,amount:a}));
  const ym=todayISO().slice(0,7), [Y,Mo]=ym.split("-").map(Number), last=new Date(Y,Mo,0).getDate(), today=+todayISO().slice(8);
  const day=d=>`${ym}-${String(Math.max(1,Math.min(last,d))).padStart(2,"0")}`;
  const cake=S.products[0];
  // 4 pedidos activos: 1.660 facturados, 740 de seña, 896 de costo
  const act=[[L.demoNames[0],L.orderBirthday,265,100,cake.id,1,0],[L.demoNames[1],L.orderCupcakes,240,240,null,1,96],[L.demoNames[2],L.orderWedding,900,400,null,1,540],[L.demoNames[3],L.orderMixed,255,0,null,1,102]];
  act.forEach(([c,d,pr,pd,pid,q,co],k)=>S.orders.push({id:uid(),client:c,phone:"",productId:pid,desc:d,qty:q,price:pr,paid:pd,date:day(today+[3,4,10,5][k]),delivered:false,cost:co,notes:""}));
  // 31 entregados y pagados: 5.180 facturados, 1.414 de costo (sumas exactas)
  const prices=[], costs=[]; let ps=0, cs=0;
  for(let k=0;k<30;k++){const p=[120,150,165,180,190,140][k%6];const c=Math.round(p*.27);prices.push(p);costs.push(c);ps+=p;cs+=c}
  prices.push(5180-ps);costs.push(1414-cs);
  prices.forEach((p,k)=>{const nm=L.demoNames[k%L.demoNames.length];S.orders.push({id:uid(),client:nm,phone:"",productId:null,desc:k%3?L.demoProducts[2][0]:L.demoProducts[0][0],qty:1,price:p,paid:p,date:day(1+(k%Math.max(1,Math.min(28,today)))),delivered:true,cost:costs[k],notes:""})});
  const ck=S.products[0]; rProducts.draft={name:ck.name,ing:ck.ing,pack:ck.pack,hours:ck.hours,rate:ck.rate,gas:ck.gas,marg:ck.marg};
  persist();render();
}
